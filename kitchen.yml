---
# Runs Busser the way Test Kitchen actually runs it -- real verifier,
# real busser, real suite transfer -- but against the machine running the tests
# rather than a VM or container, so it works unchanged in CI.
driver:
  name: exec

provisioner:
  name: dummy

verifier:
  name: busser
  # The verifier defaults to Chef's omnibus Ruby, which is not what is running
  # here, and to sudo, which is not needed for a path under the workspace.
  ruby_bindir: <%= RbConfig::CONFIG["bindir"] %>
  sudo: false
  root_path: <%= ENV.fetch("BUSSER_ROOT", "/tmp/busser-kitchen") %>

platforms:
  - name: local

suites:
  # busser-bash is the exercise: a real plugin, installed by the verifier from
  # RubyGems, driven by the busser built from this working tree. The internal
  # dummy runner would prove the chain runs but can never fail, so it would not
  # notice a regression.
  - name: default
